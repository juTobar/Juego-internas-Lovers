<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedQuiz: Neo-Medicine 2099</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-blue: #0066ff;
            --neon-purple: #bc13fe;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.8);
            --error: #ff0055;
            --success: #00ffaa;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%),
                linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Contenedor Principal */
        #game-card {
            background: var(--glass);
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(15px);
            position: relative;
        }

        #game-card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), transparent, var(--neon-purple));
            z-index: -1;
            border-radius: 22px;
            opacity: 0.3;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
            margin-top: 0;
        }

        .progress-container {
            margin-bottom: 20px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #94a3b8;
        }

        /* Estilo de la Pregunta */
        #question-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 10px;
            border-right: 4px solid var(--neon-cyan);
            margin-bottom: 30px;
            text-align: left;
        }

        #question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Botones de Opciones */
        .options-grid { display: grid; gap: 15px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 18px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            transform: translateX(10px);
        }

        .correct { 
            background: rgba(0, 255, 170, 0.2) !important; 
            border-color: var(--success) !important; 
            color: var(--success);
            text-shadow: 0 0 10px var(--success);
        }

        .wrong { 
            background: rgba(255, 0, 85, 0.2) !important; 
            border-color: var(--error) !important; 
            color: var(--error);
            text-shadow: 0 0 10px var(--error);
        }

        /* Botón Siguiente */
        #next-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            background: var(--neon-blue);
            color: white;
            border: none;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--neon-blue);
            display: none;
            transition: 0.3s;
        }

        #next-btn:hover { background: #0052cc; transform: scale(1.02); }

        .hidden { display: none; }

        /* Efectos de HUD */
        .scanline {
            width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.1);
            position: fixed; top: 0; left: 0;
            animation: scanning 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scanning {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

<div class="scanline"></div>

<div id="game-card">
    <header>
        <h1>🧬 BIO-Internas-lovers</h1>
        <div class="progress-container">
            SYSTEM STATUS: <span id="status-text" style="color: var(--success)">ACTIVE</span> | 
            SYNC: <span id="q-current">1</span>/20
        </div>
    </header>

    <div id="quiz-area">
        <div id="question-box">
            <p id="question-text">INICIALIZANDO ESCANEO DE CASO CLÍNICO...</p>
        </div>
        <div id="options-container" class="options-grid"></div>
        <button id="next-btn">TRANSMITIR DATOS ➜</button>
    </div>

    <div id="result-area" class="hidden">
        <h2 style="font-family: 'Orbitron'; color: var(--neon-cyan);">ANÁLISIS COMPLETADO</h2>
        <p id="final-score" style="font-size: 3rem; margin: 10px 0; font-family: 'Orbitron';"></p>
        <p id="feedback-msg" style="font-size: 1.2rem; color: #94a3b8;"></p>
        <button onclick="location.reload()" class="option-btn" style="width: 100%; margin-top: 20px; border-color: var(--neon-purple); color: var(--neon-purple);">REINICIAR TERMINAL</button>
    </div>
</div>

<script>
    // Se mantienen las mismas 20 preguntas anteriores
    const questions = [
        { q: "MASCULINO 65 AÑOS. DOLOR RETROESTERNAL OPRESIVO (30 MIN) + DIAFORESIS. EKG: ST ELEVADO EN V1-V4. ¿DIAGNÓSTICO?", options: ["ANGINA INESTABLE", "IAM CON ST ELEVADO (ANT)", "PERICARDITIS", "DISSECCIÓN AÓRTICA"], correct: 1 },
        { q: "MUJER 24 AÑOS. DOLOR EN FID + NÁUSEAS + SIGNO DE REBOTE (+). ¿DIAGNÓSTICO?", options: ["CÁLCULO RENAL", "EMBARAZO ECTÓPICO", "APENDICITIS AGUDA", "QUISTE OVARIO"], correct: 2 },
        { q: "INFANTE 8 AÑOS. FIEBRE + ESTRIDOR INSPIRATORIO + TOS 'PERRUNA'. ¿CUADRO CLÍNICO?", options: ["CRUP (LARINGOTRAQUEÍTIS)", "EPIGLOTITIS", "ASMA", "CUERPO EXTRAÑO"], correct: 0 },
        { q: "FEMENINA 30 AÑOS. FATIGA + INTOLERANCIA AL FRÍO + PIEL SECA. TSH ELEVADA, T4 BAJA. ¿SOSPECHA?", options: ["HIPERTIROIDISMO", "HIPOTIROIDISMO PRIMARIO", "GRAVES", "CUSHING"], correct: 1 },
        { q: "TRAUMA VIAL. DESVIACIÓN TRAQUEAL + AUSENCIA DE RUIDOS RESPIRATORIOS DERECHOS + HIPOTENSIÓN. ¿ACCIÓN?", options: ["RX TÓRAX", "DESCOMPRESIÓN CON AGUJA", "INTUBACIÓN", "TORACOTOMÍA"], correct: 1 },
        { q: "ALCOHÓLICO CRÓNICO + HEMATEMESIS MASIVA + SIGNOS DE CIRROSIS. ¿ETIOLOGÍA?", options: ["ÚLCERA GÁSTRICA", "MALLORY-WEISS", "VARICES ESOFÁGICAS", "CÁNCER"], correct: 2 },
        { q: "RN (24H VIDA) PRESENTA ICTERICIA GENERALIZADA. ¿CAUSA PRINCIPAL EN ESTE TIEMPO?", options: ["FISIOLÓGICA", "POR LECHE MATERNA", "ISOINMUNIZACIÓN (HEMÓLISIS)", "ATRESIA BILIAR"], correct: 2 },
        { q: "POLIURIA + POLIDIPSIA + POLIFAGIA. GLUCEMIA BASAL: 250 MG/DL. ¿ESTADO?", options: ["DIABETES MELLITUS", "DIABETES INSÍPIDA", "CUSHING", "HIPOGLUCEMIA"], correct: 0 },
        { q: "PACIENTE 70 AÑOS. HEMIPARESIA DERECHA SÚBITA + DESVIACIÓN COMISURA LABIAL. ¿ACCIÓN?", options: ["ASPIRINA", "TAC CRÁNEO SIMPLE", "RM", "PUNCIÓN LUMBAR"], correct: 1 },
        { q: "VARÓN 20 AÑOS. DOLOR LUMBAR CÓLICO IRRADIADO A TESTÍCULO + HEMATURIA. ¿SOSPECHA?", options: ["PROSTATITIS", "EPIDIDIMITIS", "LITIASIS RENAL", "TORSIÓN"], correct: 2 },
        { q: "FIEBRE + CEFALEA + RIGIDEZ DE NUCA. BRUDZINSKI (+). ¿SOSPECHA?", options: ["ENCEFALITIS", "MENINGITIS", "HSA", "MIGRAÑA"], correct: 1 },
        { q: "FEMENINA 28 AÑOS. AMENORREA (7 SEM) + DOLOR ABDOMINAL SEVERO. TEST EMBARAZO (+). ¿SOSPECHA?", options: ["ABORTO", "EMBARAZO ECTÓPICO", "MOLA", "AMENAZA ABORTO"], correct: 1 },
        { q: "NIÑO 4 AÑOS. EDEMA BIPALPEBRAL + HIPERTENSIÓN + ORINA OSCURA POST-FARINGITIS. ¿DIAGNÓSTICO?", options: ["NEFRÓTICO", "GLOMERULONEFRITIS POSTESTREP", "PIELONEFRITIS", "CISTITIS"], correct: 1 },
        { q: "TRAUMA TÓRAX. MOVIMIENTO PARADÓJICO DE PARED COSTAL. ¿DIAGNÓSTICO?", options: ["NEUMOTÓRAX", "TÓRAX INESTABLE", "HEMOTÓRAX", "CONTUSIÓN"], correct: 1 },
        { q: "PACIENTE 60 AÑOS. DISNEA ESFUERZO + ORTOPNEA + EDEMA MIEMBROS INFERIORES. ¿ESTADO?", options: ["EPOC", "IC CONGESTIVA", "NEUMONÍA", "TEP"], correct: 1 },
        { q: "PUPILA DE ARGYLL ROBERTSON (ACOMODA PERO NO REACCIONA A LUZ). ¿PATOLOGÍA?", options: ["DIABETES", "SÍFILIS TERCIARIA", "ESCLEROSIS", "GLAUCOMA"], correct: 1 },
        { q: "MUJER. DOLOR HIPOCONDRIO DERECHO POST-COLECITOQUINÉTICOS. MURPHY (+). ¿DIAGNÓSTICO?", options: ["PANCREATITIS", "COLECISTITIS AGUDA", "HEPATITIS", "APENDICITIS"], correct: 1 },
        { q: "TRIADA DE CHARCOT (FIEBRE, ICTERICIA, DOLOR HD). ¿PROCESO?", options: ["COLANGITIS", "COLELITIASIS", "HEPATITIS A", "CÁNCER PÁNCREAS"], correct: 0 },
        { q: "75 AÑOS. PÉRDIDA MEMORIA PROGRESIVA + DESORIENTACIÓN. ¿SOSPECHA?", options: ["DELIRIUM", "ALZHEIMER", "DEPRESIÓN", "VÉRTIGO"], correct: 1 },
        { q: "INTOXICACIÓN POR OPIOIDES (HEROÍNA). ANTÍDOTO DE ELECCIÓN:", options: ["FLUMAZENIL", "NALOXONA", "ATROPINA", "GLUCONATO CALCIO"], correct: 1 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    function loadQuestion() {
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        document.getElementById('q-current').innerText = currentQuestionIndex + 1;

        nextBtn.style.display = 'none';
        optionsContainer.innerHTML = '';
        
        let currentQuestion = questions[currentQuestionIndex];
        questionText.innerText = currentQuestion.q;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.onclick = () => selectAnswer(index, button);
            optionsContainer.appendChild(button);
        });
    }

    function selectAnswer(index, button) {
        let correctIdx = questions[currentQuestionIndex].correct;
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.disabled = true);

        if (index === correctIdx) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('wrong');
            allButtons[correctIdx].classList.add('correct');
        }
        document.getElementById('next-btn').style.display = 'block';
    }

    document.getElementById('next-btn').onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    };

    function showResults() {
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('result-area').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${Math.round((score/20)*100)}%`;
        
        let msg = "";
        if(score >= 18) msg = "NIVEL ALPHA: CONEXIÓN NEURAL PERFECTA. DIAGNÓSTICOS PRECISOS.";
        else if(score >= 14) msg = "NIVEL BETA: CAPACIDAD OPERATIVA ESTABLE. BUEN RENDIMIENTO.";
        else msg = "FALLO DE SISTEMA: RECALIBRACIÓN REQUERIDA. REGRESA A LOS ARCHIVOS.";
        
        document.getElementById('feedback-msg').innerText = msg;
    }

    loadQuestion();
</script>

</body>
</html>
